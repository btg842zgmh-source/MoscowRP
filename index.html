
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Москва RP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91aabb;font-family:Arial}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none}
#loading{position:fixed;inset:0;background:#17232d;color:white;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10;line-height:1.7;padding:25px}
#logo{position:fixed;top:15px;left:16px;color:white;font-weight:bold;font-size:21px;text-shadow:0 2px 6px #000;pointer-events:none}
#sub{position:fixed;top:43px;left:17px;color:white;font-size:11px;text-shadow:0 2px 5px #000;pointer-events:none}
#controls{position:fixed;bottom:22px;left:18px;display:grid;grid-template-columns:58px 58px 58px;gap:7px}
button{width:58px;height:56px;border:1px solid #ffffff80;border-radius:14px;background:#17232dcc;color:white;font-size:24px;touch-action:none}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#status{position:fixed;right:15px;bottom:28px;color:white;font-size:12px;text-shadow:0 2px 5px #000}
</style>
</head>
<body>
<div id="loading">МОСКВА RP<br>Подключение игрового движка...</div>
<canvas id="renderCanvas"></canvas>
<div id="logo">МОСКВА RP</div>
<div id="sub">OPEN WORLD • CITY LIFE</div>
<div id="controls">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="down">▼</button>
<button id="right">▶</button>
</div>
<div id="status">Загрузка...</div>

<script>
const loading=document.getElementById("loading");
function error(message){
 loading.style.display="flex";
 loading.innerHTML="МОСКВА RP<br>"+message+"<br><br>Обнови страницу и попробуй ещё раз.";
}
const script=document.createElement("script");
script.src="https://cdn.babylonjs.com/babylon.js";
script.onload=()=>startGame();
script.onerror=()=>error("Не удалось загрузить 3D-движок. Проверь интернет.");
document.head.appendChild(script);

function startGame(){
try{
const canvas=document.getElementById("renderCanvas");
const engine=new BABYLON.Engine(canvas,true,{antialias:true,preserveDrawingBuffer:false,stencil:false});
engine.setHardwareScalingLevel(1.5);

const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.55,.70,.80,1);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=.0018;
scene.fogColor=new BABYLON.Color3(.55,.70,.80);

const camera=new BABYLON.FollowCamera("camera",new BABYLON.Vector3(0,7,20),scene);
camera.radius=17;
camera.heightOffset=6;
camera.rotationOffset=180;
camera.cameraAcceleration=.06;
camera.maxCameraSpeed=20;
scene.activeCamera=camera;

const light=new BABYLON.HemisphericLight("light",new BABYLON.Vector3(0,1,0),1.3);
light.groundColor=new BABYLON.Color3(.35,.35,.35);
const sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-.5,-1,.4),1.3);

function material(name,color,rough=.8,metal=0){
const m=new BABYLON.PBRMaterial(name,scene);
m.albedoColor=BABYLON.Color3.FromHexString(color);
m.roughness=rough;
m.metallic=metal;
return m;
}
const ground=material("Земля","#536a48");
const asphalt=material("Асфальт","#30343a",.95);
const sidewalk=material("Тротуар","#92938e");
const glass=material("Стекло","#385d72",.25,.4);
const white=material("Разметка","#e4e2d9");
const metal=material("Металл","#4b5155",.4,.6);

function block(name,w,h,d,x,y,z,mat){
const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);
m.position.set(x,y+h/2,z);
m.material=mat;
return m;
}

block("Земля",900,1,900,0,-1,0,ground);

// Дороги
block("Главная дорога",28,.12,900,0,0,0,asphalt);
block("Поперечная дорога",900,.12,28,0,0,-120,asphalt);
block("Вторая дорога",900,.12,28,0,0,120,asphalt);
block("Дорога запад",22,.12,900,-180,0,0,asphalt);
block("Дорога восток",22,.12,900,180,0,0,asphalt);

for(let z=-420;z<420;z+=18){
block("Разметка",.18,.03,8,0,.09,z,white);
}
for(let x=-420;x<420;x+=18){
block("Разметка",8,.03,.18,x,.09,-120,white);
block("Разметка",8,.03,.18,x,.09,120,white);
}
for(const x of [-24,24,-195,195]){
block("Тротуар",5,.25,900,x,.08,0,sidewalk);
}

// Городские здания
const buildingColors=["#aaa79c","#89969a","#b9b4a7","#7e898e","#c2bcae"];
let index=0;
for(let x=-400;x<=400;x+=70){
for(let z=-400;z<=400;z+=70){
if(Math.abs(x)<48||Math.abs(x-180)<35||Math.abs(x+180)<35)continue;
if(Math.abs(z+120)<40||Math.abs(z-120)<40)continue;
for(let n=0;n<2;n++){
const bx=x+(Math.random()-.5)*20;
const bz=z+(Math.random()-.5)*20;
const w=20+Math.random()*13;
const d=20+Math.random()*13;
const h=18+Math.random()*45;
const facade=material("Фасад"+index,buildingColors[index++%5]);
block("Дом",w,h,d,bx,h/2,bz,facade);
for(let y=5;y<h-3;y+=6){
for(let side of [-1,1]){
const win=block("Окно",2,2,.08,bx,y+1,bz+side*(d/2+.05),glass);
}
}
}
}
}

// Москва-Сити
function tower(x,z,w,d,h,color){
const m=material("Стекло башни",color,.2,.6);
block("Небоскрёб",w,h,d,x,h/2+2,z,m);
for(let y=10;y<h;y+=8){
block("Этажный пояс",w+.15,.25,d+.15,x,y+2,z,metal);
}
}
tower(-60,-120,32,32,140,"#527b90");
tower(-15,-120,29,29,190,"#41647b");
tower(30,-120,34,34,165,"#668a9e");
tower(75,-120,25,25,120,"#7496a5");
tower(115,-120,22,22,90,"#53778a");

// Парковая зона
const leaves=material("Листва","#315b36");
const wood=material("Дерево","#64452e");
block("Парк",95,.2,95,280,.1,260,ground);
for(let i=0;i<20;i++){
const x=240+Math.random()*80;
const z=220+Math.random()*80;
const trunk=BABYLON.MeshBuilder.CreateCylinder("Ствол",{height:4,diameter:.7},scene);
trunk.position.set(x,2,z);trunk.material=wood;
const crown=BABYLON.MeshBuilder.CreateSphere("Крона",{diameter:6,segments:8},scene);
crown.position.set(x,5,z);crown.material=leaves;
}

// Игрок
const player=new BABYLON.TransformNode("Игрок",scene);
const clothes=material("Одежда","#202d48");
const skin=material("Кожа","#bd9273");
const body=BABYLON.MeshBuilder.CreateCapsule("Персонаж",{height:2.8,radius:.55},scene);
body.position.y=1.5;body.material=clothes;body.parent=player;
const head=BABYLON.MeshBuilder.CreateSphere("Голова",{diameter:1,segments:12},scene);
head.position.y=3.3;head.material=skin;head.parent=player;
player.position.set(0,0,18);
camera.lockedTarget=player;

// Управление
const move={up:false,down:false,left:false,right:false};
function bind(id,key){
const b=document.getElementById(id);
b.addEventListener("pointerdown",e=>{
e.preventDefault();move[key]=true;
b.setPointerCapture(e.pointerId);
});
b.addEventListener("pointerup",()=>move[key]=false);
b.addEventListener("pointercancel",()=>move[key]=false);
b.addEventListener("lostpointercapture",()=>move[key]=false);
}
bind("up","up");bind("down","down");
bind("left","left");bind("right","right");
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

scene.onBeforeRenderObservable.add(()=>{
const dt=Math.min(engine.getDeltaTime()/1000,.04);
let x=0,z=0;
if(move.up||keys.w||keys.arrowup)z-=1;
if(move.down||keys.s||keys.arrowdown)z+=1;
if(move.left||keys.a||keys.arrowleft)x-=1;
if(move.right||keys.d||keys.arrowright)x+=1;
if(x||z){
const len=Math.hypot(x,z);
x/=len;z/=len;
player.position.x+=x*13*dt;
player.position.z+=z*13*dt;
player.rotation.y=Math.atan2(x,z);
}
});

engine.runRenderLoop(()=>scene.render());
addEventListener("resize",()=>engine.resize());
document.getElementById("status").textContent="МОСКВА • 3D";
loading.style.display="none";
}catch(e){
console.error(e);
error("Ошибка запуска: "+e.message);
}
}
</script>
</body>
</html>
