
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Москва RP 1.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91a9b8;font-family:Arial,sans-serif}
#game{width:100%;height:100%;display:block;touch-action:none}
#loading{position:fixed;inset:0;background:#101820;color:white;display:grid;place-items:center;z-index:20;text-align:center;font-weight:bold;font-size:23px}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #000}
#logo{position:absolute;top:13px;left:14px;font-size:21px;font-weight:900}
#location{position:absolute;top:41px;left:15px;font-size:11px;color:#ddd}
#money{position:absolute;top:14px;right:14px;font-size:17px;font-weight:bold;color:#7dff9c}
#minimap{position:absolute;top:65px;right:12px;width:112px;height:112px;border:2px solid #ffffffaa;border-radius:12px;background:#18242ccc}
#message{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:15px;text-align:center;max-width:90%;font-weight:bold}
#controls{position:fixed;left:15px;bottom:20px;display:grid;grid-template-columns:58px 58px 58px;gap:6px}
button{border:1px solid #ffffff88;border-radius:13px;background:#101820cc;color:white;font-size:21px;font-weight:bold;touch-action:none;min-width:54px;min-height:52px}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{position:fixed;right:14px;bottom:20px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#actions button{font-size:13px;padding:0 13px;min-width:105px;min-height:43px}
#garagePanel{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(310px,90vw);padding:18px;background:#101820f2;color:white;border:1px solid #ffffff55;border-radius:16px;text-align:center}
#garagePanel button{margin:5px;font-size:14px;padding:8px}
#hint{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:10px;color:#ddd;white-space:nowrap}
</style>
</head>
<body>
<div id="loading">МОСКВА RP 1.0<br><small>Загрузка игрового мира...</small></div>
<canvas id="game"></canvas>

<div id="hud">
 <div id="logo">МОСКВА RP</div>
 <div id="location">МОСКВА • ОТКРЫТЫЙ МИР</div>
 <div id="money">₽ 25 000</div>
 <canvas id="minimap" width="180" height="180"></canvas>
 <div id="message"></div>
 <div id="hint">Подойди к транспорту и нажми «Действие»</div>
</div>

<div id="controls">
 <button id="up">▲</button>
 <button id="left">◀</button>
 <button id="down">▼</button>
 <button id="right">▶</button>
</div>

<div id="actions">
 <button id="action">ДЕЙСТВИЕ</button>
 <button id="job">РАБОТА +₽</button>
 <button id="garage">ГАРАЖ</button>
 <button id="exit" style="display:none">ВЫЙТИ ИЗ ТРАНСПОРТА</button>
</div>

<div id="garagePanel">
 <h3>ГАРАЖ МОСКВА RP</h3>
 <p id="vehicleName">Транспорт рядом</p>
 <button id="paint">СМЕНИТЬ ЦВЕТ</button>
 <button id="closeGarage">ЗАКРЫТЬ</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js"></script>
<script>
(function(){
const loading=document.getElementById("loading");
function fail(msg){
 loading.innerHTML="МОСКВА RP<br><small>"+msg+"</small>";
}
if(!window.BABYLON){fail("Не загрузился 3D-движок. Проверь интернет.");return;}

try{
const B= BABYLON;
const canvas=document.getElementById("game");
const engine=new B.Engine(canvas,true,{antialias:true,stencil:false});
engine.setHardwareScalingLevel(1.35);

const scene=new B.Scene(engine);
scene.clearColor=new B.Color4(.55,.69,.79,1);
scene.fogMode=B.Scene.FOGMODE_EXP2;
scene.fogDensity=.0016;
scene.fogColor=new B.Color3(.55,.69,.79);

const hemi=new B.HemisphericLight("sky",new B.Vector3(0,1,0),1.1);
hemi.groundColor=new B.Color3(.3,.32,.3);
const sun=new B.DirectionalLight("sun",new B.Vector3(-.5,-1,.3),1.5);
sun.position=new B.Vector3(100,150,-100);

const camera=new B.FollowCamera("camera",new B.Vector3(0,8,20),scene);
camera.radius=15;
camera.heightOffset=5;
camera.rotationOffset=180;
camera.cameraAcceleration=.06;
camera.maxCameraSpeed=30;
scene.activeCamera=camera;

function mat(name,color,roughness){
 const m=new B.StandardMaterial(name,scene);
 m.diffuseColor=B.Color3.FromHexString(color);
 m.specularColor=new B.Color3(.16,.16,.16);
 if(roughness!==undefined)m.specularPower=roughness;
 return m;
}
const grass=mat("Земля","#526d49");
const asphalt=mat("Асфальт","#30343a");
const sidewalk=mat("Тротуар","#92938e");
const lineMat=mat("Разметка","#e7e5dc");
const glass=mat("Стекло","#385b70");
const darkGlass=mat("Тёмное стекло","#172c3b");
const metal=mat("Металл","#454b50");
const rubber=mat("Шины","#111315");
const skin=mat("Кожа","#bd9273");
const clothes=mat("Одежда","#202d48");
const leaf=mat("Листва","#315b36");
const wood=mat("Дерево","#64452e");

function block(name,w,h,d,x,y,z,material,parent){
 const m=B.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);
 m.position.set(x,y+h/2,z);
 m.material=material;
 if(parent)m.parent=parent;
 return m;
}
function cylinder(name,diam,height,x,y,z,material,parent){
 const m=B.MeshBuilder.CreateCylinder(name,{diameter:diam,height,tessellation:12},scene);
 m.position.set(x,y,z);m.material=material;
 if(parent)m.parent=parent;
 return m;
}

// Земля и дорожная сеть
block("Территория",1100,1,1100,0,-1,0,grass);
const roads=[0,150,-150,300,-300];
for(const x of roads){
 block("Продольная дорога",25,.12,1100,x,.01,0,asphalt);
 block("Тротуар",4,.25,1100,x-15,.08,0,sidewalk);
 block("Тротуар",4,.25,1100,x+15,.08,0,sidewalk);
}
for(const z of roads){
 block("Поперечная дорога",1100,.12,25,0,.01,z,asphalt);
 block("Тротуар",1100,.25,4,0,.08,z-15,sidewalk);
 block("Тротуар",1100,.25,4,0,.08,z+15,sidewalk);
}
for(let z=-520;z<520;z+=18){
 for(const x of roads)block("Разметка",.16,.025,7,x,.09,z,lineMat);
}
for(let x=-520;x<520;x+=18){
 for(const z of roads)block("Разметка",7,.025,.16,x,.09,z,lineMat);
}

// Материалы фасадов
const facadeColors=["#aaa79c","#89969a","#b9b4a7","#7e898e","#c2bcae","#a5a6a0"];
const facades=facadeColors.map((c,i)=>mat("Фасад "+i,c));
let buildingNumber=0;

function building(x,z,w,d,h,index){
 const wall=facades[index%facades.length];
 block("Дом",w,h,d,x,h/2,z,wall);
 // Окна на двух фасадах
 for(let y=4;y<h-2;y+=5){
  for(let wx=x-w/2+3;wx<x+w/2-1;wx+=5){
   block("Окно",1.7,2,.09,wx,y,z-d/2-.06,glass);
   block("Окно",1.7,2,.09,wx,y,z+d/2+.06,glass);
  }
 }
 block("Крыша",w+.4,.4,d+.4,x,h,z,metal);
 buildingNumber++;
}

// Кварталы
for(let x=-450;x<=450;x+=65){
 for(let z=-450;z<=450;z+=65){
  if(Math.abs(x)<42||Math.abs(z)<42)continue;
  if(Math.abs(x-150)<40||Math.abs(x+150)<40)continue;
  if(Math.abs(z-150)<40||Math.abs(z+150)<40)continue;
  const count=1+(Math.random()>.55?1:0);
  for(let n=0;n<count;n++){
   const bx=x+(Math.random()-.5)*20;
   const bz=z+(Math.random()-.5)*20;
   building(bx,bz,18+Math.random()*15,18+Math.random()*15,18+Math.random()*42,buildingNumber);
  }
 }
}

// Москва-Сити
function tower(x,z,w,d,h,color){
 const glassTower=mat("Башня "+x,color);
 block("Башня",w,h,d,x,h/2+2,z,glassTower);
 for(let y=12;y<h;y+=9)block("Пояс",w+.2,.25,d+.2,x,y+2,z,metal);
 block("Верхушка",w*.35,7,d*.35,x,h+5,z,glassTower);
}
tower(-65,-150,31,31,145,"#557e95");
tower(-20,-150,28,28,195,"#3e637b");
tower(25,-150,34,34,165,"#7193a4");
tower(75,-150,24,24,120,"#547b91");
tower(115,-150,22,22,95,"#7c9eaa");

// Парк
block("Парк",100,.2,100,270,.1,270,grass);
for(let i=0;i<32;i++){
 const x=225+Math.random()*90,z=225+Math.random()*90;
 cylinder("Ствол",.7,4,x,2,z,wood);
 const crown=B.MeshBuilder.CreateSphere("Крона",{diameter:6,segments:8},scene);
 crown.position.set(x,5,z);crown.material=leaf;
}

// Фонари
const lamp=mat("Опора фонаря","#30373b");
for(let z=-400;z<=400;z+=70){
 for(const x of [-23,23]){
  block("Фонарь",.22,7,.22,x,3.5,z,lamp);
  block("Кронштейн",2,.16,.16,x+(x<0?1:-1),6.8,z,lamp);
  block("Свет",.7,.2,.7,x+(x<0?2:-2),6.7,z,lineMat);
 }
}

// Транспорт
const vehicleColors=["#b51e2b","#20252b","#d3d4d2","#274b78","#7d858b","#eeeeea"];
const vehicles=[];

function makeCar(x,z,color,name){
 const root=new B.TransformNode(name,scene);
 const paint=mat("Кузов "+name,color);
 block("Кузов",4.3,1.25,7.5,0,1,0,paint,root);
 block("Крыша",3.5,1.2,3.7,0,2.1,-.3,glass,root);
 for(const wx of [-2.2,2.2]){
  for(const wz of [-2.4,2.4]){
   const wheel=cylinder("Колесо",1.35,.42,wx,.8,wz,rubber,root);
   wheel.rotation.z=Math.PI/2;
  }
 }
 block("Капот",4.1,.35,1.5,0,1.65,2.65,paint,root);
 root.position.set(x,0,z);
 const v={root,name,paint,color,kind:"car",speed:0};
 vehicles.push(v);
 return v;
}
function makeBike(x,z){
 const root=new B.TransformNode("Питбайк",scene);
 const frame=mat("Рама питбайка","#c3262d");
 const wheelMat=mat("Колёса питбайка","#151515");
 for(const wz of [-1.4,1.4]){
  const wheel=cylinder("Колесо питбайка",1.3,.35,0,.8,wz,wheelMat,root);
  wheel.rotation.z=Math.PI/2;
 }
 block("Рама",.25,.35,2.4,0,1.3,0,frame,root);
 block("Бак",.8,.65,.9,0,1.8,-.2,frame,root);
 block("Сиденье",.8,.2,1.1,0,2.1,-.9,clothes,root);
 block("Руль",1.5,.12,.12,0,2.3,1.1,metal,root);
 root.position.set(x,0,z);
 const v={root,name:"Питбайк",paint:frame,color:"#c3262d",kind:"bike",speed:0};
 vehicles.push(v);
 return v;
}
makeCar(12,25,"#b51e2b","Седан");
makeCar(-24,55,"#20252b","Чёрный автомобиль");
makeCar(30,-55,"#274b78","Синий автомобиль");
makeBike(-10,30);

// Игрок
const player=new B.TransformNode("Игрок",scene);
const human=B.MeshBuilder.CreateCapsule("Персонаж",{height:2.7,radius:.52},scene);
human.position.y=1.45;human.material=clothes;human.parent=player;
const head=B.MeshBuilder.CreateSphere("Голова",{diameter:1,segments:12},scene);
head.position.y=3.15;head.material=skin;head.parent=player;
player.position.set(0,0,0);
camera.lockedTarget=player;

// Состояние игры
let money=25000;
let wanted=0;
let currentVehicle=null;
let currentPaint=0;
let messageTimer=null;
const move={up:false,down:false,left:false,right:false};
const keys={};

function say(text){
 const el=document.getElementById("message");
 el.textContent=text;
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>el.textContent="",2600);
}
function updateMoney(){
 document.getElementById("money").textContent="₽ "+money.toLocaleString("ru-RU");
}
function bind(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();move[key]=true;
  try{b.setPointerCapture(e.pointerId)}catch(_){}
 });
 const stop=()=>move[key]=false;
 b.addEventListener("pointerup",stop);
 b.addEventListener("pointercancel",stop);
 b.addEventListener("lostpointercapture",stop);
}
bind("up","up");bind("down","down");bind("left","left");bind("right","right");
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function nearestVehicle(){
 let nearest=null,dist=Infinity;
 for(const v of vehicles){
  const d=B.Vector3.Distance(player.position,v.root.position);
  if(d<12&&d<dist){nearest=v;dist=d;}
 }
 return nearest;
}
function enterVehicle(){
 if(currentVehicle){
  player.position.copyFrom(currentVehicle.root.position);
  player.position.x+=5;
  player.setEnabled(true);
  currentVehicle=null;
  camera.lockedTarget=player;
  human.setEnabled(true);head.setEnabled(true);
  document.getElementById("exit").style.display="none";
  say("Ты вышел из транспорта");
  return;
 }
 const v=nearestVehicle();
 if(!v){say("Подойди ближе к автомобилю или питбайку");return;}
 currentVehicle=v;
 human.setEnabled(false);head.setEnabled(false);
 player.setEnabled(false);
 camera.lockedTarget=v.root;
 document.getElementById("exit").style.display="block";
 say("Ты сел: "+v.name);
}
document.getElementById("action").onclick=enterVehicle;
document.getElementById("exit").onclick=enterVehicle;

// Работа
document.getElementById("job").onclick=()=>{
 const reward=500+Math.floor(Math.random()*501);
 money+=reward;updateMoney();
 say("Работа выполнена! Получено ₽"+reward);
};

// Гараж и покраска
document.getElementById("garage").onclick=()=>{
 const v=currentVehicle||nearestVehicle();
 if(!v){say("Подойди к своему транспорту");return;}
 window.garageVehicle=v;
 document.getElementById("vehicleName").textContent=v.name;
 document.getElementById("garagePanel").style.display="block";
};
document.getElementById("closeGarage").onclick=()=>{
 document.getElementById("garagePanel").style.display="none";
};
document.getElementById("paint").onclick=()=>{
 const v=window.garageVehicle;
 if(!v)return;
 if(money<1000){say("Не хватает денег на покраску");return;}
 money-=1000;updateMoney();
 currentPaint=(currentPaint+1)%vehicleColors.length;
 v.paint.diffuseColor=B.Color3.FromHexString(vehicleColors[currentPaint]);
 say("Транспорт покрашен! Потрачено ₽1 000");
};

// Простейшая система штрафа
function policeCheck(){
 if(!currentVehicle){say("Сначала сядь в транспорт");return;}
 if(wanted===0){
  wanted=1;
  say("Внимание! Полиция заметила нарушение");
 }else{
  const fine=1500;
  money=Math.max(0,money-fine);
  wanted=0;updateMoney();
  say("ГИБДД выписала штраф ₽"+fine);
 }
}
document.getElementById("location").textContent="МОСКВА • РАЙОН ЦЕНТР";
document.getElementById("status")?.remove();

// Мини-карта
const mini=document.getElementById("minimap");
const ctx=mini.getContext("2d");
function drawMap(){
 ctx.clearRect(0,0,180,180);
 ctx.fillStyle="#344b3a";ctx.fillRect(0,0,180,180);
 ctx.fillStyle="#4a5055";
 for(let p=0;p<180;p+=30){
  ctx.fillRect(p,0,7,180);ctx.fillRect(0,p,180,7);
 }
 ctx.fillStyle="#67899a";ctx.fillRect(72,15,40,35);
 ctx.fillStyle="#f5e6a0";
 ctx.beginPath();ctx.arc(90,90,5,0,Math.PI*2);ctx.fill();
 const pos=currentVehicle?currentVehicle.root.position:player.position;
 ctx.fillStyle="#ff5555";
 ctx.beginPath();
 ctx.arc(90+pos.x*.12,90+pos.z*.12,4,0,Math.PI*2);ctx.fill();
}

// Игровой цикл
scene.onBeforeRenderObservable.add(()=>{
 const dt=Math.min(engine.getDeltaTime()/1000,.04);
 let x=0,z=0;
 if(move.up||keys.w||keys.arrowup)z-=1;
 if(move.down||keys.s||keys.arrowdown)z+=1;
 if(move.left||keys.a||keys.arrowleft)x-=1;
 if(move.right||keys.d||keys.arrowright)x+=1;
 if(x||z){
  const len=Math.hypot(x,z);x/=len;z/=len;
  if(currentVehicle){
   const v=currentVehicle;
   const max=v.kind==="bike"?28:22;
   v.speed+=(z<0?1:-1)*max*dt;
   v.speed=Math.max(-max*.45,Math.min(max,v.speed));
   v.root.position.x+=x*max*.55*dt;
   v.root.position.z+=z*v.speed*dt;
   v.root.rotation.y=Math.atan2(x,z);
  }else{
   const running=keys.shift?1.65:1;
   player.position.x+=x*8*running*dt;
   player.position.z+=z*8*running*dt;
   player.rotation.y=Math.atan2(x,z);
  }
 }else if(currentVehicle){
  currentVehicle.speed*=.94;
  if(Math.abs(currentVehicle.speed)<.15)currentVehicle.speed=0;
 }
 drawMap();
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
updateMoney();
loading.style.display="none";
say("Добро пожаловать в Москву!");
}catch(e){
 console.error(e);
 fail("Ошибка запуска: "+e.message);
}
})();
</script>
</body>
</html>
